name: build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: goldib-linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: goldib-windows-x86_64.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: goldib-macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: goldib-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          bin=target/${{ matrix.target }}/release/goldib
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "dist/${{ matrix.name }}"
          cp config.example.toml .env.example README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  # Publishes (or updates) the GitHub Release "v<Cargo version>" with the four
  # binaries on pushes to main and on version tags.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir release
          for d in artifacts/goldib-*; do cp "$d/$(basename "$d")" release/; done
          cp config.example.toml .env.example release/
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: goldib v${{ steps.ver.outputs.version }}
          body: |
            Download the file for your computer, put it in a folder with your `.env` file
            (the same one GoldCatcher uses) and run `goldib check`, then `goldib`.

            | Computer | File |
            |---|---|
            | Windows 10/11 | `goldib-windows-x86_64.exe` |
            | Mac (Apple chip) | `goldib-macos-arm64` |
            | Mac (Intel) | `goldib-macos-x86_64` |
            | Linux / VPS | `goldib-linux-x86_64` |
          files: release/*
