[package]
name = "goldib"
version = "0.1.0"
edition = "2024"
description = "Gold Secret Inside-Bar & Fakeout Wick strategy: XAUUSD 5m signals with SL/TP posted to Telegram, plus a backtester"
license = "MPL-2.0"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["sink"] }
lzma-rs = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
